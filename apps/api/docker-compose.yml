services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oddjobs
      POSTGRES_USER: oddjobs
      POSTGRES_PASSWORD: oddjobs_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - oddjobs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddjobs -d oddjobs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oddjobs_postgres_data: